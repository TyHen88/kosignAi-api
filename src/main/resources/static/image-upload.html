<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPC Bank - Image OCR Query</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            border: 3px dashed #ddd;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: #2196F3;
            background: #f8f9ff;
        }

        .upload-section.drag-over {
            border-color: #2196F3;
            background: #e3f2fd;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        .preview-section {
            margin: 30px 0;
            text-align: center;
        }

        .image-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
            display: none;
        }

        .process-btn {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.2em;
            transition: all 0.3s ease;
            display: none;
        }

        .process-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .process-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-section {
            margin-top: 30px;
            display: none;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border-left: 5px solid #2196F3;
        }

        .extracted-text {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ai-response {
            background: #f1f8e9;
            padding: 20px;
            border-radius: 8px;
            margin: 15px 0;
            line-height: 1.6;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 5px solid #f44336;
        }

        .success {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            border-left: 5px solid #4caf50;
        }

        .status-info {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .status-info h3 {
            color: #1976d2;
            margin-bottom: 15px;
        }

        .status-info ul {
            list-style: none;
            padding: 0;
        }

        .status-info li {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }

        .status-info li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 PPC Bank Image OCR</h1>
            <p>Upload an image to extract text and query our banking database</p>
        </div>

        <div class="content">
            <!-- Upload Section -->
            <div class="upload-section" id="uploadSection">
                <h3>📁 Upload Your Image</h3>
                <p>Drag and drop an image here, or click to select</p>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    Choose Image File
                </button>
                <p style="margin-top: 15px; color: #666; font-size: 0.9em;">
                    Supported formats: JPEG, PNG, BMP, WebP (Max: 20MB)
                </p>
            </div>

            <!-- Preview Section -->
            <div class="preview-section">
                <img id="imagePreview" class="image-preview" alt="Image Preview">
                <br>
                <button id="processBtn" class="process-btn" onclick="processImage()">
                    🔍 Extract Text & Query Database
                </button>
            </div>

            <!-- Loading -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processing image and extracting text...</p>
            </div>

            <!-- Results -->
            <div class="result-section" id="resultSection">
                <div class="result-card">
                    <h3>📄 Results</h3>
                    <div id="results"></div>
                </div>
            </div>

            <!-- Status Info -->
            <div class="status-info">
                <h3>🔧 Service Status</h3>
                <div id="statusInfo">Loading status...</div>
            </div>
        </div>
    </div>

    <script>
        let selectedFile = null;
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const processBtn = document.getElementById('processBtn');
        const uploadSection = document.getElementById('uploadSection');
        const loading = document.getElementById('loading');
        const resultSection = document.getElementById('resultSection');
        const results = document.getElementById('results');
        const statusInfo = document.getElementById('statusInfo');

        // File input change handler
        fileInput.addEventListener('change', handleFileSelect);

        // Drag and drop handlers
        uploadSection.addEventListener('dragover', handleDragOver);
        uploadSection.addEventListener('dragleave', handleDragLeave);
        uploadSection.addEventListener('drop', handleDrop);

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                previewImage(file);
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            uploadSection.classList.add('drag-over');
        }

        function handleDragLeave(event) {
            event.preventDefault();
            uploadSection.classList.remove('drag-over');
        }

        function handleDrop(event) {
            event.preventDefault();
            uploadSection.classList.remove('drag-over');
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    selectedFile = file;
                    fileInput.files = files;
                    previewImage(file);
                } else {
                    showError('Please select a valid image file.');
                }
            }
        }

        function previewImage(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                imagePreview.src = e.target.result;
                imagePreview.style.display = 'block';
                processBtn.style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }

        async function processImage() {
            if (!selectedFile) {
                showError('Please select an image file first.');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            resultSection.style.display = 'none';
            processBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('image', selectedFile);
                formData.append('sessionId', 'web-session-' + Date.now());

                const response = await fetch('/api/image/query', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showResults(data);
                } else {
                    showError(data.error || 'Failed to process image');
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error: ' + error.message);
            } finally {
                loading.style.display = 'none';
                processBtn.disabled = false;
            }
        }

        function showResults(data) {
            const response = data.response;
            
            // Extract the text and AI response
            const lines = response.split('\n');
            let extractedText = '';
            let aiResponse = '';
            let foundExtracted = false;
            
            for (let line of lines) {
                if (line.includes('Image Text Extracted')) {
                    foundExtracted = true;
                    extractedText = line.replace(/.*Image Text Extracted.*?[""](.*)[""].*/, '$1');
                } else if (foundExtracted && line.trim()) {
                    aiResponse += line + '\n';
                }
            }

            results.innerHTML = `
                <div class="success">✅ Image processed successfully!</div>
                
                <h4>📝 Extracted Text:</h4>
                <div class="extracted-text">${extractedText || 'No text found'}</div>
                
                <h4>🤖 AI Response:</h4>
                <div class="ai-response">${aiResponse || response}</div>
                
                <h4>📊 Processing Details:</h4>
                <ul style="list-style: none; padding: 0;">
                    <li><strong>File:</strong> ${data.filename}</li>
                    <li><strong>Size:</strong> ${(data.fileSize / 1024).toFixed(2)} KB</li>
                    <li><strong>Type:</strong> ${data.contentType}</li>
                    <li><strong>Session:</strong> ${data.sessionId}</li>
                    <li><strong>Processed:</strong> ${new Date(data.timestamp).toLocaleString()}</li>
                </ul>
            `;
            
            resultSection.style.display = 'block';
        }

        function showError(message) {
            results.innerHTML = `<div class="error">❌ ${message}</div>`;
            resultSection.style.display = 'block';
        }

        // Load service status
        async function loadStatus() {
            try {
                const response = await fetch('/api/image/status');
                const data = await response.json();
                
                if (data.success) {
                    statusInfo.innerHTML = `
                        <ul>
                            <li><strong>OCR Enabled:</strong> ${data.ocrEnabled ? '✅ Yes' : '❌ No'}</li>
                            <li><strong>Max File Size:</strong> ${data.maxFileSize}</li>
                            <li><strong>Supported Formats:</strong> ${data.supportedFormats.join(', ')}</li>
                            <li><strong>AI Providers:</strong> ${data.aiProviders.join(', ')}</li>
                            <li><strong>Features:</strong> ${data.features.join(', ')}</li>
                        </ul>
                    `;
                } else {
                    statusInfo.innerHTML = '<div class="error">Failed to load status</div>';
                }
            } catch (error) {
                statusInfo.innerHTML = '<div class="error">Error loading status: ' + error.message + '</div>';
            }
        }

        // Load status on page load
        loadStatus();
    </script>
</body>
</html>
