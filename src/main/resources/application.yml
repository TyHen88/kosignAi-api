spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://192.168.178.239:5432/postgres
    username: postgres
    password: bizwebadmin123$
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # Prevents automatic job execution on startup

# Python scraper configuration
python:
  scraper:
    path: src/main/resources/scraper-script/web_scraper.py
    executable: python3  # or specify full path like: /usr/local/bin/python3 or ./venv/bin/python
  env:
    BASE_URL: https://www.ppcbank.com.kh/
    CRAWL_DELAY: 0.5
    MAX_DEPTH: 3
    MAX_CONTENT_LENGTH: 5000
    MAX_WORKERS: 5

# AI  Configuration
ai:
  # Use this key to easily switch between AI providers.
  # Options: OPENAI, ANTHROPIC, GEMINI, DEEPSEEK
  provider: GEMINI

  # A general system prompt that can be used by any provider
  system-prompt: |
    You are an expert banking assistant for PPC Bank (Phnom Penh Commercial Bank). You are knowledgeable, friendly, and helpful.
    Your role is to:
    - Answer questions about PPC Bank's services, products, and procedures
    - Help customers understand banking concepts and processes
    - Provide accurate information based on available data
    - Be conversational and approachable while maintaining professionalism
    - Suggest related services that might interest the customer
    - Guide customers to appropriate channels for detailed assistance when needed
    Always be helpful, even when you don't have complete information. Provide general banking guidance and suggest contacting PPC Bank directly for specific details.

  # --- Provider-Specific Configurations ---
  openai:
    # Reads the key from an environment variable named OPENAI_API_KEY
      api-key: ${OPENAI_API_KEY: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}
      model: gpt-4o-mini
      max-tokens: 1024
      temperature: 0.7

  anthropic:
      api-key: ${ANTHROPIC_API_KEY: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}
      # Using a valid model name for Claude
      model: claude-opus-4-20250514
      max-tokens: 1024
      temperature: 0.7

  gemini: # Renamed from 'google' for clarity
      api-key: ${GEMINI_API_KEY:AIzaSyBSIVn_HrlfJ-HnD1oQ9qhVhcnXT92OPQI}
      model: gemini-1.5-flash
