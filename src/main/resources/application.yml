# Spring Batch scheduler config
scraper:
  schedule:
    cron: "0 30 2 * * ?" #"*/30 * * * * ?"  Every 30 seconds for testing; change to "0 0 3 * * ?" for daily at 3AM
    # For production, use: "0 0 3 * * ?" (daily at 3AM)
    # Other examples:
    # "0 */15 * * * ?" (every 15 minutes)
    # "0 30 2 * * ?" (daily at 2:30 AM)

# Logging configuration
logging:
  level:
    org.kosign.chatbotapi.batch: DEBUG
    org.springframework.batch: INFO
    org.kosign.chatbotapi.config.springBatch: DEBUG
    org.springframework.sql.init: DEBUG
    org.kosign.chatbotapi.service: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8099


# Password Encryption
password:
  encryption:
    key: mytestkeyasdddds

# JWT Configuration
jwt:
  expiration: 86400000 # 24 hours in milliseconds
  issuer: planpro-app
  secret: mySecretKey
  expirationMs: 86400000 # 24 hours in milliseconds

# RSA Keys Configuration
rsa:
  public-key: classpath:certs/public-key.pem
  private-key: classpath:certs/private-key.pem


springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
    config-url: /v3/api-docs/swagger-config
    urls:
      - url: /v3/api-docs/public
        name: Public API
      - url: /v3/api-docs/authentication
        name: Authentication API
    display-request-duration: true
    filter: true
  api-docs:
    path: /v3/api-docs
  show-actuator: false
  cache:
    disabled: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json