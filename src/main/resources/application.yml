spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    url: jdbc:postgresql://192.168.178.239:5432/postgres
    username: postgres
    password: bizwebadmin123$
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # Prevents automatic job execution on startup

# Python scraper configuration
python:
  scraper:
    path: src/main/resources/scraper-script/web_scraper.py
    executable: python3  # or specify full path like: /usr/local/bin/python3 or ./venv/bin/python
  env:
    BASE_URL: https://www.ppcbank.com.kh/
    CRAWL_DELAY: 0.5
    MAX_DEPTH: 3
    MAX_CONTENT_LENGTH: 5000
    MAX_WORKERS: 5

