spring:
  servlet:
    multipart:
      enabled: ${SPRING_SERVLET_MULTIPART_ENABLED:true}
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}

  application:
    name: ${SPRING_APPLICATION_NAME:api-gateway}

  main:
    allow-bean-definition-overriding: ${SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING:true}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
        jdbc:
          batch_size: ${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_SIZE:20}
          batch_versioned_data: ${SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_BATCH_VERSIONED_DATA:true}
        order_inserts: ${SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_INSERTS:true}
        order_updates: ${SPRING_JPA_PROPERTIES_HIBERNATE_ORDER_UPDATES:true}

  datasource: 
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:60000}
      auto-commit: ${SPRING_DATASOURCE_HIKARI_AUTO_COMMIT:false}

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: ${SPRING_SQL_INIT_SCHEMA_LOCATIONS:classpath:schema.sql}
      continue-on-error: ${SPRING_SQL_INIT_CONTINUE_ON_ERROR:true}

  batch:
    jdbc:
      initialize-schema: ${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:always}
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}

export:
  simple:
    enabled: ${EXPORT_SIMPLE_ENABLED:true}

python:
  scraper:
    path: ${PYTHON_SCRAPER_PATH}
    executable: ${PYTHON_SCRAPER_EXECUTABLE}
  env:
    BASE_URL: ${PYTHON_ENV_BASE_URL}
    CRAWL_DELAY: ${PYTHON_ENV_CRAWL_DELAY:0.5}
    MAX_DEPTH: ${PYTHON_ENV_MAX_DEPTH:3}
    MAX_CONTENT_LENGTH: ${PYTHON_ENV_MAX_CONTENT_LENGTH:5000}
    MAX_WORKERS: ${PYTHON_ENV_MAX_WORKERS:5}

ai:
  provider: ${AI_PROVIDER:OPENAI}
  system-prompt: ${AI_SYSTEM_PROMPT}

  openai:
    api-key: ${AI_OPENAI_API_KEY}
    model: ${AI_OPENAI_MODEL:gpt-4o-mini}
    max-tokens: ${AI_OPENAI_MAX_TOKENS:1024}
    temperature: ${AI_OPENAI_TEMPERATURE:0.7}

  anthropic:
    api-key: ${AI_ANTHROPIC_API_KEY}
    model: ${AI_ANTHROPIC_MODEL:claude-opus-4-20250514}
    max-tokens: ${AI_ANTHROPIC_MAX_TOKENS:1024}
    temperature: ${AI_ANTHROPIC_TEMPERATURE:0.7}

  gemini:
    api-key: ${AI_GEMINI_API_KEY}
    model: ${AI_GEMINI_MODEL:gemini-1.5-flash}
    max-tokens: ${AI_GEMINI_MAX_TOKENS:1024}
    temperature: ${AI_GEMINI_TEMPERATURE:0.7}

  deepseek:
    api-key: ${AI_DEEPSEEK_API_KEY}
    model: ${AI_DEEPSEEK_MODEL:deepseek-chat}
    max-tokens: ${AI_DEEPSEEK_MAX_TOKENS:1024}
    temperature: ${AI_DEEPSEEK_TEMPERATURE:0.7}

  chat:
    system-prompt: ${AI_CHAT_SYSTEM_PROMPT}

bakong:
  api:
    base-url: ${BAKONG_API_BASE_URL}
    renew-token:
      endpoint: ${BAKONG_API_RENEW_TOKEN_ENDPOINT}
      email: ${BAKONG_API_RENEW_TOKEN_EMAIL}
    check-transaction:
      endpoint: ${BAKONG_API_CHECK_TRANSACTION_ENDPOINT}
    timeout: ${BAKONG_API_TIMEOUT}
    max-retries: ${BAKONG_API_MAX_RETRIES}
    token: ${BAKONG_API_TOKEN}

scraper:
  schedule:
    cron: ${SCRAPER_SCHEDULE_CRON:"0 30 2 * * ?" }

logging:
  level:
    org.kosign.chatbotapi.batch: ${LOGGING_LEVEL_ORG_KOSIGN_CHATBOTAPI_BATCH:DEBUG}
    org.springframework.batch: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_BATCH:INFO}
    org.kosign.chatbotapi.config.springBatch: ${LOGGING_LEVEL_ORG_KOSIGN_CHATBOTAPI_CONFIG_SPRINGBATCH:DEBUG}
    org.springframework.sql.init: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SQL_INIT:DEBUG}
    org.kosign.chatbotapi.service: ${LOGGING_LEVEL_ORG_KOSIGN_CHATBOTAPI_SERVICE:DEBUG}
    org.springframework.web.multipart: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_MULTIPART:DEBUG}
  pattern:
    console: ${LOGGING_PATTERN_CONSOLE:"%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"}

server:
  port: ${SERVER_PORT:8099}

password:
  encryption:
    key: ${PASSWORD_ENCRYPTION_KEY}

app:
  encryption:
    secret-key: ${APP_ENCRYPTION_SECRET_KEY}
    iv: ${APP_ENCRYPTION_IV}
  security:
    mask-token: ${APP_SECURITY_MASK_TOKEN:true}

jwt:
  expiration: ${JWT_EXPIRATION}
  issuer: ${JWT_ISSUER}
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXPIRATIONMS}

rsa:
  public-key: ${RSA_PUBLIC_KEY}
  private-key: ${RSA_PRIVATE_KEY}

springdoc:
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:method}
    tags-sorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}
    disable-swagger-default-url: ${SPRINGDOC_SWAGGER_UI_DISABLE_SWAGGER_DEFAULT_URL:true}
    config-url: ${SPRINGDOC_SWAGGER_UI_CONFIG_URL:/v3/api-docs/swagger-config}
    urls:
      - url: ${SPRINGDOC_SWAGGER_UI_URLS_0_URL:/v3/api-docs/public}
        name: ${SPRINGDOC_SWAGGER_UI_URLS_0_NAME:Public API}
      - url: ${SPRINGDOC_SWAGGER_UI_URLS_1_URL:/v3/api-docs/authentication}
        name: ${SPRINGDOC_SWAGGER_UI_URLS_1_NAME:Authentication API}
    display-request-duration: ${SPRINGDOC_SWAGGER_UI_DISPLAY_REQUEST_DURATION:true}
    filter: ${SPRINGDOC_SWAGGER_UI_FILTER:true}

  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  show-actuator: ${SPRINGDOC_SHOW_ACTUATOR:false}
  cache:
    disabled: ${SPRINGDOC_CACHE_DISABLED:true}
  default-consumes-media-type: ${SPRINGDOC_DEFAULT_CONSUMES_MEDIA_TYPE:application/json}
  default-produces-media-type: ${SPRINGDOC_DEFAULT_PRODUCES_MEDIA_TYPE:application/json}