spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Performance optimizations
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  datasource:
    url: jdbc:postgresql://localhost:5433/web_scraper?autoCommit=false
    username: postgres
    password: 12345678
    driver-class-name: org.postgresql.Driver
    # Connection pool optimization
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      auto-commit: false  # This is critical for @Transactional to work properly

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false  # Prevents automatic job execution on startup


    export:
      simple:
        enabled: true

# Python scraper configuration
python:
  scraper:
    path: src/main/resources/scraper-script/web_scraper.py
    executable: python3  # or specify full path like: /usr/local/bin/python3 or ./venv/bin/python
  env:
    BASE_URL: https://www.ppcbank.com.kh/
    CRAWL_DELAY: 0.5
    MAX_DEPTH: 3
    MAX_CONTENT_LENGTH: 5000
    MAX_WORKERS: 5

